<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Des chiffres et des lettres</title>
<style>
:root{--bg:#14233f;--card:#1e3560;--ac:#ffd24a;--tx:#fff;--mut:#9fb3d9;--ok:#4cd68a;--ko:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px}
.hide{display:none!important}
h1{text-align:center;color:var(--ac);letter-spacing:2px;margin:32px 0 24px;font-size:clamp(24px,7vw,34px);line-height:1.2;text-transform:uppercase}
h2{text-align:center;color:var(--ac)}
h3{color:var(--ac);margin:14px 0 6px;font-size:16px}
.btn{background:var(--card);color:var(--tx);border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
.btn.p{background:var(--ac);color:#14233f}.btn:disabled{opacity:.4}
.btn.sm{padding:8px 10px;font-size:14px;white-space:nowrap}
.mb{display:block;width:100%;margin-bottom:12px;font-size:20px;padding:18px}
.mrow{display:flex;gap:8px;margin-bottom:12px}.mrow .mb{margin-bottom:0;flex:1}
.info{flex:0 0 62px;border:0;border-radius:10px;background:var(--card);color:var(--ac);font-size:24px;font-weight:800;cursor:pointer}
.row{display:flex;gap:8px;margin:10px 0}.row .btn{flex:1}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px}
.tl{display:flex;gap:6px}
.stg{text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px}
#time,#ctime{font-size:28px;font-weight:800}.low{color:var(--ko)}
.tiles{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tile{flex:1 1 0;min-width:0;max-width:54px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#14233f;border:0;border-radius:8px;font-size:clamp(16px,6vw,26px);font-weight:800;cursor:pointer}
input{width:100%;padding:14px;font-size:22px;text-align:center;text-transform:uppercase;border-radius:10px;border:2px solid var(--card);background:#0e1a30;color:var(--tx)}
#msg,#cmsg,#dmsg{text-align:center;min-height:24px;margin:8px 0;font-weight:700}.ok{color:var(--ok)}.ko{color:var(--ko)}
.res{display:flex;justify-content:space-between;background:var(--card);padding:8px 12px;border-radius:8px;margin:4px 0}.res.ok span:last-child{color:var(--ok)}
.big{font-size:56px;font-weight:800;text-align:center;color:var(--ac)}
.ptot{text-align:center;font-weight:800;font-size:20px;margin:8px 0}
.tgt{display:flex;justify-content:center;gap:8px;margin:6px 0}
.tgt b{width:52px;height:72px;display:flex;align-items:center;justify-content:center;background:#0e1a30;border:2px solid var(--card);border-radius:10px;font-size:50px;font-weight:800;color:var(--ac)}
.tgt b.rl{color:var(--mut)}
.plates{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.plate{padding:14px 0;font-size:clamp(16px,5.5vw,24px);font-weight:800;background:var(--ac);color:#14233f;border:0;border-radius:10px;cursor:pointer;text-align:center}
.plate.sel{outline:3px solid #fff}.plate.used,.plate.ph{opacity:.25}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.plate.pop{animation:pop .3s ease-out}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ops .btn{font-size:26px;padding:10px 0}.ops .btn.sel{background:var(--ac);color:#14233f}
.cl{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:8px;padding:6px 8px;margin:4px 0}
.cl .ex{font-weight:700;font-size:18px}.cl .plate{padding:8px 0;width:84px;font-size:20px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--card)}.dots i.d{background:var(--ok)}.dots i.c{outline:2px solid var(--ac)}
.sub{display:block;font-size:12px;font-weight:400;margin-top:4px;opacity:.75}
.rt p{line-height:1.5;color:var(--mut)}
#vidP{position:fixed;inset:0;background:#000;z-index:50}#vid{width:100%;height:100%;object-fit:contain}
#vskip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:12px;background:rgba(0,0,0,.6)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#mcard{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%}
#mcard h2{margin-top:0}#mb p{line-height:1.5;color:var(--mut)}
#mbtn{display:flex;gap:8px;margin-top:12px}#mbtn .btn{flex:1;background:#0e1a30}#mbtn .btn.p{background:var(--ac)}

rW:`<p>Huit mots mélangés à retrouver : 5, 6, 7 et 8 lettres, puis encore 5, 6, 7 et 8 lettres.</p><p>Tu as 2 minutes pour toute la partie. Tape ta réponse ou touche les lettres. Chaque mot juste rapporte 1 point par lettre.</p><p>Tu peux passer un mot et y revenir plus tard. Les réponses s'affichent quand la musique est terminée.</p><p>Avant la partie, choisis le dictionnaire : français ou anglais.</p>`,
rL:`<p>Dix lettres sont tirées : à chaque tirage, tu choisis voyelle ou consonne (au moins 2 de chaque).</p><p>Tu as 30 secondes pour former le mot le plus long possible, chaque lettre une seule fois. Chaque mot valide rapporte 1 point par lettre, ton meilleur mot compte.</p><p>À la fin, le plus long mot possible du dictionnaire est révélé. Dictionnaire français ou anglais au choix.</p>`,
rC:`<p>Six plaques sont tirées au hasard (de 1 à 10, et 25, 50, 75, 100), ainsi qu'un nombre cible entre 101 et 999.</p><p>Avec + − × ÷ (résultats entiers positifs) et chaque plaque une seule fois, atteins la cible ou approche-t'en au plus près. Touche une plaque, un opérateur, puis une seconde plaque. Chaque résultat intermédiaire s'affiche à droite de sa ligne et peut être sélectionné pour la suite.</p><p>Tu as 45 secondes : la manche va jusqu'au bout du temps et de la musique, mais tu peux toucher Terminer pour voir le résultat plus tôt. 10 points si le compte est bon, 7 points à 5 d'écart maximum, 5 points à 10 d'écart maximum.</p>`},

rW:`<p>Eight scrambled words to find: 5, 6, 7 and 8 letters, then 5, 6, 7 and 8 letters again.</p><p>You have 2 minutes for the whole game. Type your answer or tap the letters. Each correct word scores 1 point per letter.</p><p>You can skip a word and come back to it later. Answers appear once the music has finished.</p><p>Before the game, choose the dictionary: French or English.</p>`,

function solve(n,T){let b=null,bd=1e9;const seen=new Set();
 (function rec(a){if(bd===0)return;const k=a.map(x=>x.v).sort((x,y)=>x-y).join();if(seen.has(k))return;seen.add(k);
  for(const x of a){const d=Math.abs(x.v-T);if(d<bd){bd=d;b=x}}
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const x=a[i],y=a[j],rest=a.filter((_,m)=>m!==i&&m!==j),hi=x.v>=y.v?x:y,lo=hi===x?y:x,c=[[x.v+y.v,"+"],[x.v*y.v,"×"]];
   if(hi.v>lo.v)c.push([hi.v-lo.v,"−"]);if(hi.v%lo.v===0)c.push([hi.v/lo.v,"÷"]);
   for(const[v,o]of c){const f=(o==="−"||o==="÷")?hi:x,s=f===x?y:x;rec(rest.concat({v,s:"("+f.s+" "+o+" "+s.s+")"}))}}})(n.map(v=>({v,s:""+v})));
 return{v:b.v,s:b.s.replace(/^\((.*)\)$/,"$1")}}
